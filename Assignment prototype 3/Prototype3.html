<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>My weather app</title>
  </head
  <body>
	<h1>Weather in Luton</h1>
	<p id="myParagraph">Please wait...</p>
	<p id="theTemp">Please wait...</p>
	<p id="theWind">Please wait...</p>
	<p id="myDatetime">Please wait...</p>
	
	
	
	<script>
	
	// Check browser cache first, use if there and less than 10 seconds old
    if(localStorage.when != null
       && parseInt(localStorage.when) + 10000 > Date.now()) {

      let freshness = Math.round((Date.now() - localStorage.when)/1000) + " second(s)";
      document.getElementById("myParagraph").innerHTML = localStorage.myWeather;
      document.getElementById("theTemp").innerHTML = localStorage.myTemperature;
	  document.getElementById("theWind").innerHTML = localStorage.myWind;
      document.getElementById("myDatetime").innerHTML = freshness;
	
    // No local cache, access network
    } else {

	    // Fetch Luton weather data from API
        fetch('https://mi-linux.wlv.ac.uk/~2442655/my-api.php?city=luton')
	
          // Convert response string to json object
          .then(response => response.json())
          .then(response => {

          // Display whole API response in browser console (take a look at it!)
          console.log(response);
		
            // Copy one element of response to our HTML paragraph
            document.getElementById("myParagraph").innerHTML = response.weather_description;
            document.getElementById("theTemp").innerHTML = 'Temperature: ' + response.weather_temperature + '°C';
	        document.getElementById("theWind").innerHTML = 'Wind of Speed: ' + response.weather_wind + ' meter/sec';
	        document.getElementById("myDatetime").innerHTML = 'Time: ' + response.weather_when;
	
            // Save new data to browser, with new timestamp
            localStorage.myWeather = response.weather_description;
            localStorage.myTemperature = response.weather_temperature + '°';
			localStorage.theWind = response.weather_wind + 'meter/sec';
            localStorage.when = Date.now(); // milliseconds since January 1 1970
		
	
          })
          .catch(err => {
	
			// Display errors in console
			console.log(err);
	
    });        
	
}
	</script>
   </body>
</html>
